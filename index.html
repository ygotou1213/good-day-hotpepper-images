<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good day HotPepper画像 一覧比較 - 2026年9月</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --card-bg: #ffffff;
    --text: #2a2620;
    --muted: #7a7267;
    --accent: #b8455a;
    --border: #e8e0d4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --card-bg: #262320;
      --text: #ede8e0;
      --muted: #a89e8f;
      --accent: #e0899a;
      --border: #3a352e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  header {
    padding: 32px 24px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: clamp(20px, 4vw, 28px);
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 16px 64px;
  }
  section {
    margin-top: 40px;
  }
  section h2 {
    font-size: 18px;
    border-left: 4px solid var(--accent);
    padding-left: 10px;
    margin-bottom: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .grid.wide {
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  figure {
    margin: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
  }
  figcaption {
    padding: 8px 12px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  figcaption .num {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 999px;
    margin-right: 6px;
  }
  .hero-block figure {
    grid-column: 1 / -1;
  }
</style>
</head>
<body>
<header>
  <h1>Good day HotPepper画像 一覧比較</h1>
  <p>2026年9月分 — このページで全確定画像を見比べて、修正指示を出せます</p>
</header>
<main>

  <section class="hero-block">
    <h2>① キービジュアル</h2>
    <div class="grid wide">
      <figure>
        <img src="2026-09/01_hero/hero.png" alt="キービジュアル（確定版）">
        <figcaption>確定版（すすき野原・両手髪上げ仰け反りポーズ）</figcaption>
      </figure>
    </div>
  </section>

  <section class="hero-block">
    <h2>② 店内写真（固定・毎回変更なし）</h2>
    <div class="grid wide">
      <figure>
        <img src="_fixed/02_store_photo/store_photo.png" alt="店内写真（固定）">
        <figcaption>固定画像（月次で変更しない）</figcaption>
      </figure>
    </div>
  </section>

  <section class="hero-block">
    <h2>③ サブビジュアル</h2>
    <div class="grid wide">
      <figure>
        <img src="2026-09/02_sub_visual/sub_visual.png" alt="サブビジュアル（確定版）">
        <figcaption>確定版</figcaption>
      </figure>
    </div>
  </section>

  <section>
    <h2>ワングラ</h2>
    <div class="grid">
      <figure><img src="2026-09/03_coupons/01_wangura/01_hand-wangura-onecolor.png"><figcaption><span class="num">#1</span>Handワンカラー or グラデーション</figcaption></figure>
      <figure><img src="2026-09/03_coupons/01_wangura/02_hand-wangura-magnet.png"><figcaption><span class="num">#2</span>Handマグネット or フラッシュワンカラー</figcaption></figure>
      <figure><img src="2026-09/03_coupons/01_wangura/08_hand-clear-french.png"><figcaption><span class="num">#8</span>Handクリアベースフレンチ</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>時短系（2026-09新設・独立カテゴリ）</h2>
    <div class="grid">
      <figure><img src="2026-09/03_coupons/08_jitan/22_hand-jitan-onecolor.png"><figcaption><span class="num">#22</span>Hand時短ワンカラー（特集3「60分仕上げ」対応）</figcaption></figure>
      <figure><img src="2026-09/03_coupons/08_jitan/23_foot-jitan-onecolor.png"><figcaption><span class="num">#23</span>Foot時短ワンカラー</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>定額アート</h2>
    <div class="grid">
      <figure><img src="2026-09/03_coupons/02_teigaku-art/03_hand-teigaku-simple-line.png"><figcaption><span class="num">#3</span>Hand定額Simple line</figcaption></figure>
      <figure><img src="2026-09/03_coupons/02_teigaku-art/04_hand-teigaku-trend-line.png"><figcaption><span class="num">#4</span>Hand定額Trend line</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>フット</h2>
    <div class="grid">
      <figure><img src="2026-09/03_coupons/03_foot/05_foot-onecolor.png"><figcaption><span class="num">#5</span>Footワンカラー or グラデーション</figcaption></figure>
      <figure><img src="2026-09/03_coupons/03_foot/09_foot-magnet.png"><figcaption><span class="num">#9</span>Footマグネット or フラッシュワンカラー</figcaption></figure>
      <figure><img src="2026-09/03_coupons/03_foot/10_foot-simple-line.png"><figcaption><span class="num">#10</span>Foot定額Simple line</figcaption></figure>
      <figure><img src="2026-09/03_coupons/03_foot/11_foot-trend-line.png"><figcaption><span class="num">#11</span>Foot定額Trend line</figcaption></figure>
      <figure><img src="2026-09/03_coupons/03_foot/12_foot-mochikomi-90min.png"><figcaption><span class="num">#12</span>Foot持ち込み90min</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>持ち込み</h2>
    <div class="grid">
      <figure><img src="2026-09/03_coupons/04_mochikomi/06_hand-mochikomi-90min.png"><figcaption><span class="num">#6</span>Hand持ち込み90min</figcaption></figure>
      <figure><img src="2026-09/03_coupons/04_mochikomi/07_hand-mochikomi-120min.png"><figcaption><span class="num">#7</span>Hand持ち込み120min</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>フット＋ケア</h2>
    <div class="grid">
      <figure><img src="2026-09/03_coupons/05_foot-care/13_foot-care-makizume.png"><figcaption><span class="num">#13</span>Footワンカラー（巻き爪ケア）</figcaption></figure>
      <figure><img src="2026-09/03_coupons/05_foot-care/14_foot-care-kakushitsu-care.png"><figcaption><span class="num">#14</span>Footワンカラー（角質・くすみケア）</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>その他</h2>
    <div class="grid">
      <figure><img src="2026-09/03_coupons/06_sonota/15_hand-natural-care-nogel.png"><figcaption><span class="num">#15</span>Handナチュラルケア（ジェルなし）</figcaption></figure>
      <figure><img src="2026-09/03_coupons/06_sonota/16_hand-natural-care-geloff.png"><figcaption><span class="num">#16</span>Handナチュラルケア（ジェルオフ込）</figcaption></figure>
      <figure><img src="2026-09/03_coupons/06_sonota/17_hand-nekotsume-onecolor.png"><figcaption><span class="num">#17</span>Hand猫爪ワンカラー</figcaption></figure>
      <figure><img src="2026-09/03_coupons/06_sonota/18_hand-nekotsume-art.png"><figcaption><span class="num">#18</span>Hand猫爪アート</figcaption></figure>
      <figure><img src="2026-09/03_coupons/06_sonota/19_hand-ducknail-art.png"><figcaption><span class="num">#19</span>Handダックネイルアート</figcaption></figure>
      <figure><img src="2026-09/03_coupons/06_sonota/21_hand-ducknail-onecolor.png"><figcaption><span class="num">#21</span>Handダックネイルワンカラー</figcaption></figure>
    </div>
  </section>

  <section>
    <h2>ハンドフット</h2>
    <div class="grid">
      <figure><img src="2026-09/03_coupons/07_hand-foot/20_hand-foot-onecolor.png"><figcaption><span class="num">#20</span>Hand&amp;Foot ワンカラー or グラデーション</figcaption></figure>
    </div>
  </section>

</main>
</body>
</html>
